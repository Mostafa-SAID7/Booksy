version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "samirsaid3560-hash"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "samirsaid3560-hash"
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "build"
      include: "scope"
    # Group updates by type
    groups:
      security-updates:
        dependency-type: "all"
        update-types:
          - "patch"
        patterns:
          - "*"
      minor-updates:
        dependency-type: "all"
        update-types:
          - "minor"
        patterns:
          - "*"
      major-updates:
        dependency-type: "all"
        update-types:
          - "major"
        patterns:
          - "*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "samirsaid3560-hash"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "ci"
      include: "scope"
