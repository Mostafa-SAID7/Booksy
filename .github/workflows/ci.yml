name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: '**/Booksy.csproj'

      - name: Restore dependencies
        run: dotnet restore --verbosity minimal
        working-directory: ./Booksy

      - name: Build
        run: dotnet build --configuration Release --no-restore --verbosity minimal
        working-directory: ./Booksy

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=test-results.trx"
        working-directory: ./Booksy
        continue-on-error: true

      - name: Validate migrations
        run: dotnet ef migrations list --no-build
        working-directory: ./Booksy
        continue-on-error: true

      - name: Verify DbContext
        run: dotnet ef dbcontext info --no-build
        working-directory: ./Booksy
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./Booksy/TestResults/
          retention-days: 30

  lint-yaml:
    name: Validate Workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint workflows
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          config_data: |
            rules:
              line-length:
                max: 180
              indentation:
                spaces: 2
              truthy:
                check-keys: false

  docker-validate:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [ backend, lint-yaml, docker-validate ]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "❌ Backend build/test failed"
            exit 1
          fi
          if [ "${{ needs.lint-yaml.result }}" != "success" ]; then
            echo "❌ YAML validation failed"
            exit 1
          fi
          if [ "${{ needs.docker-validate.result }}" != "success" ]; then
            echo "❌ Docker validation failed"
            exit 1
          fi
          echo "✅ All quality gates passed"
