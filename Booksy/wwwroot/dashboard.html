<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksy Dashboard</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .stat-card {
            position: relative;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: var(--r);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .stat-icon.blue { background: var(--primary-dim); color: var(--primary); }
        .stat-icon.green { background: var(--success-dim); color: var(--success); }
        .stat-icon.yellow { background: var(--warning-dim); color: var(--warning); }
        .stat-icon.cyan { background: var(--accent-dim); color: var(--accent); }

        .stat-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .stat-sub {
            font-size: 0.8rem;
            color: var(--text-subtle);
        }

        .metric-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .metric-label i {
            font-size: 1.1rem;
        }

        .metric-val {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }

        .top-books-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .book-rank-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--surface-2);
            border-radius: var(--r);
            transition: all var(--transition);
        }

        .book-rank-item:hover {
            background: var(--surface-3);
            transform: translateX(4px);
        }

        .rank-num {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--r);
            background: var(--surface);
            font-weight: 700;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .rank-num.top {
            background: var(--primary-dim);
            color: var(--primary);
        }

        .book-info {
            flex: 1;
            min-width: 0;
        }

        .book-title {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
        }

        .book-author {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .book-sales {
            text-align: right;
            flex-shrink: 0;
        }

        .book-sales-num {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
        }

        .book-sales-label {
            font-size: 0.75rem;
            color: var(--text-subtle);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .revenue-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 8px;
            height: 200px;
            margin-bottom: 20px;
        }

        .revenue-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 8px;
        }

        .revenue-bar {
            width: 100%;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            border-radius: var(--r-sm) var(--r-sm) 0 0;
            min-height: 20px;
            transition: all var(--transition);
        }

        .revenue-bar-wrap:hover .revenue-bar {
            opacity: 0.8;
            transform: scaleY(1.05);
        }

        .revenue-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .error-state {
            background: var(--danger-dim);
            border: 1px solid var(--danger);
            border-radius: var(--r);
            padding: 16px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-state i {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 8px;
            opacity: 0.5;
            display: block;
        }

        .refresh-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .last-updated {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .error-banner {
            background: var(--danger-dim);
            border: 1px solid var(--danger);
            border-radius: var(--r);
            padding: 12px 16px;
            margin-bottom: 20px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-banner i {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="section">
        <div class="container">
            <div class="refresh-header">
                <h1>📊 Dashboard</h1>
                <button id="refresh-btn" class="btn btn-primary">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>

            <div id="error-banner" class="error-banner hidden">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span id="error-msg"></span>
            </div>

            <div id="last-updated" class="last-updated">
                <i class="bi bi-clock"></i> Loading…
            </div>

            <!-- Main Stats -->
            <div style="margin-top: 32px; margin-bottom: 48px;">
                <h2 style="margin-bottom: 24px;">Key Metrics</h2>
                <div class="grid-4" id="dashboard-stats">
                    <!-- Populated by dashboard.js -->
                </div>
            </div>

            <!-- Book Stats -->
            <div class="card" style="margin-bottom: 24px;">
                <h3 style="margin-bottom: 16px;">📚 Book Statistics</h3>
                <div id="book-stats-content">
                    <!-- Populated by dashboard.js -->
                </div>
            </div>

            <!-- User Stats -->
            <div class="card" style="margin-bottom: 24px;">
                <h3 style="margin-bottom: 16px;">👥 User Statistics</h3>
                <div id="user-stats-content">
                    <!-- Populated by dashboard.js -->
                </div>
            </div>

            <!-- Top Books -->
            <div class="card" style="margin-bottom: 24px;">
                <h3 style="margin-bottom: 16px;">🏆 Top Selling Books</h3>
                <div id="top-books-content">
                    <!-- Populated by dashboard.js -->
                </div>
            </div>

            <!-- Revenue Chart -->
            <div class="card">
                <h3 style="margin-bottom: 16px;">💰 Monthly Revenue (6 months)</h3>
                <div id="revenue-content">
                    <!-- Populated by dashboard.js -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
