<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="/css/design-system.css">
</head>
<body>
    <div class="hero flex items-center justify-center" style="min-height: 100vh; padding: 20px;">
        <div class="container">
            <div style="font-size: 4em; font-weight: bold; color: var(--primary); margin-bottom: 10px;">404</div>
            <h1>Page Not Found</h1>
            <p class="section-subtitle">
                The resource you're looking for doesn't exist. This could be due to an invalid URL or a removed resource.
            </p>
            
            <div class="status" style="background: var(--warning-dim); border-left-color: var(--warning);">
                <strong>💡 Tip:</strong> If you're looking for API documentation, visit <code>/swagger</code>
            </div>

            <div class="hero-actions">
                <a href="/" class="btn btn-primary">← Back to Home</a>
                <a href="/swagger" class="btn btn-secondary">API Docs</a>
            </div>
        </div>
    </div>
</body>
</html>
